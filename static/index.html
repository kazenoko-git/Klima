<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klima | Emergency Climate Refuge Mapping</title>
    <style>
        :root {
            --bg-color: #0a0e1a;
            --card-bg: rgba(22, 30, 49, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-teal: #00c9a7;
            --accent-amber: #ffb347;
            --accent-red: #ff5252;
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-teal);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        input {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            width: 140px;
        }

        button {
            background: var(--accent-teal);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .weather-banner {
            background: linear-gradient(90deg, rgba(0, 201, 167, 0.1), rgba(255, 179, 71, 0.1));
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
        }

        .weather-item {
            text-align: center;
        }

        .weather-val {
            font-size: 20px;
            font-weight: 700;
            margin-top: 4px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .rank-badge {
            font-size: 12px;
            font-weight: 700;
            background: rgba(0, 201, 167, 0.2);
            color: var(--accent-teal);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .score-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--accent-teal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .venue-name {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .venue-meta {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 16px;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .metric-label {
            color: var(--text-secondary);
        }

        #loader {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: var(--accent-teal);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">🛡️ Klima Safe Zone</div>
        <div>Emergency Climate Compass MVP</div>
    </header>

    <div class="search-bar">
        <div>
            <label style="font-size: 12px; display: block; color: var(--text-secondary);">LATITUDE</label>
            <input type="number" id="latInput" value="13.118022" step="0.000001">
        </div>
        <div>
            <label style="font-size: 12px; display: block; color: var(--text-secondary);">LONGITUDE</label>
            <input type="number" id="lonInput" value="77.641051" step="0.000001">
        </div>
        <div style="display: flex; align-items: flex-end;">
            <button onclick="fetchRefuges()">Find Safe Zones</button>
        </div>
    </div>

    <div id="weatherBanner" class="weather-banner" style="display: none;">
        <div class="weather-item">
            <div style="font-size: 12px; color: var(--text-secondary);">HEAT INDEX</div>
            <div id="heatIndexVal" class="weather-val" style="color: var(--accent-amber);">--</div>
        </div>
        <div class="weather-item">
            <div style="font-size: 12px; color: var(--text-secondary);">AIR QUALITY (AQI)</div>
            <div id="aqiVal" class="weather-val">--</div>
        </div>
        <div class="weather-item">
            <div style="font-size: 12px; color: var(--text-secondary);">CONDITION</div>
            <div id="conditionVal" class="weather-val">--</div>
        </div>
    </div>

    <div id="loader">Scanning 2km radius for optimal climate refuges...</div>

    <div id="cardsGrid" class="cards-grid"></div>
</div>

<script>
    async function fetchRefuges() {
        const lat = document.getElementById('latInput').value;
        const lon = document.getElementById('lonInput').value;
        
        document.getElementById('loader').style.display = 'block';
        document.getElementById('cardsGrid').innerHTML = '';
        document.getElementById('weatherBanner').style.display = 'none';

        try {
            const res = await fetch(`/api/v1/refuges?lat=${lat}&lon=${lon}`);
            const data = await res.json();
            
            document.getElementById('loader').style.display = 'none';
            
            // Render Weather
            document.getElementById('weatherBanner').style.display = 'flex';
            document.getElementById('heatIndexVal').innerText = `${data.current_weather.heat_index_c}°C`;
            document.getElementById('aqiVal').innerText = `${data.current_weather.aqi}`;
            document.getElementById('conditionVal').innerText = data.current_weather.condition;

            // Render Refuges
            const grid = document.getElementById('cardsGrid');
            data.top_refuges.forEach((refuge, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="rank-badge">RANK #${index + 1}</span>
                            <h3 class="venue-name" style="margin-top: 8px;">${refuge.name}</h3>
                            <div class="venue-meta">${refuge.category} • ${refuge.address}</div>
                        </div>
                        <div class="score-circle">${Math.round(refuge.score)}</div>
                    </div>
                    <div class="metrics">
                        <div><span class="metric-label">Crowd Level:</span> <b>${refuge.crowd_level}</b></div>
                        <div><span class="metric-label">Elevation:</span> <b>${refuge.elevation_m}m</b></div>
                        <div><span class="metric-label">Walk Distance:</span> <b>${(refuge.distance_m/1000).toFixed(2)} km</b></div>
                        <div><span class="metric-label">Est. Time:</span> <b>${Math.round(refuge.duration_min)} mins</b></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        } catch (err) {
            document.getElementById('loader').innerText = 'Error fetching safe zones. Ensure backend server is running.';
        }
    }

    // Initial load
    fetchRefuges();
</script>
</body>
</html>
